version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: jarvis_memory_db
    restart: always
    environment:
      POSTGRES_USER: jarvis
      POSTGRES_PASSWORD: jarvis_password
      POSTGRES_DB: jarvis_memory
    ports:
      - "5433:5432"
    volumes:
      - jarvis_pgdata:/var/lib/postgresql/data

volumes:
  jarvis_pgdata:
